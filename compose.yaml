services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - internal-api

  internal-api:
    build:
      context: ./internal-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./internal-api:/app
      - /app/tmp
      - ./migrations:/migrations:ro
      - internal-go-pkg-mod:/go/pkg/mod
      - internal-go-build-cache:/root/.cache/go-build
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
      REDIS_ADDR: queue:6379
      MIGRATIONS_DIR: /migrations
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy

  exampleAdsAPI:
    build:
      context: ./exampleAdsAPI
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./exampleAdsAPI:/app
      - /app/tmp
      - exampleadsapi-go-pkg-mod:/go/pkg/mod
      - exampleadsapi-go-build-cache:/root/.cache/go-build

  db:
    image: mysql:8.4
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  queue:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    volumes:
      - ./worker:/app
      - /app/tmp
      - ./migrations:/migrations:ro
      - worker-go-pkg-mod:/go/pkg/mod
      - worker-go-build-cache:/root/.cache/go-build
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
      REDIS_ADDR: queue:6379
      MIGRATIONS_DIR: /migrations
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy

  batch:
    build:
      context: ./batch
      dockerfile: Dockerfile
    profiles:
      - tools
    volumes:
      - ./batch:/app
      - ./migrations:/migrations:ro
      - batch-go-pkg-mod:/go/pkg/mod
      - batch-go-build-cache:/root/.cache/go-build
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
      EXTERNAL_API_URL: http://exampleAdsAPI:8081
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-example-ads-demo-key}
      MIGRATIONS_DIR: /migrations
    depends_on:
      db:
        condition: service_healthy
      exampleAdsAPI:
        condition: service_started

volumes:
  frontend-node-modules:
  mysql-data:
  internal-go-pkg-mod:
  internal-go-build-cache:
  exampleadsapi-go-pkg-mod:
  exampleadsapi-go-build-cache:
  worker-go-pkg-mod:
  worker-go-build-cache:
  batch-go-pkg-mod:
  batch-go-build-cache:
